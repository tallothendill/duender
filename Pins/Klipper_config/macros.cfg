#######################################################################
# Sensorless/Eddy macros
# USER CONFIGURATION:
# SEARCH FOR "### " THROUGH THE FILE TO FIND AND ADJUST MANDATORY NEEDED VALUES
# SEARCH FOR "## " THROUGH THE FILE TO FIND AND ADJUST OPTIONAL TUNING (CONSERVATIVE) VALUES
#######################################################################

[gcode_macro START_PRINT]
description: Start print Duender
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    M140 S{BED_TEMP}
    M104 S140
    M190 S{BED_TEMP}
    G28
    Z_TILT_ADJUST
    G28 Z
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    G90
    G1 X10 Y10 Z10 F6000 
    M109 S{EXTRUDER_TEMP}
    RESPOND PREFIX=tgalarm MSG="▶️ Print start"
    # LINE_PURGE # Purge line if enabled

[gcode_macro END_PRINT]
description: End print Duender
gcode:
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set park_z = [current_z + 15.0, max_z - 1.0]|min %}
    M104 S0
    M140 S0
    M106 S0
    G90
    {% if park_z > current_z %}
        G1 Z{park_z} F3000 # Raise toolhead if possible
    {% endif %}
    PARK
    M84
    SET_PRINT_STATS_INFO CURRENT_LAYER=0
    RESPOND PREFIX=tgnotify_photo MSG="✅ Print finished"

[gcode_macro PARK]
description: Park toolhead
gcode:
    {% set park_x = printer.toolhead.axis_maximum.x|float - 35.0 %}
    {% set park_y = printer.toolhead.axis_maximum.y|float - 35.0 %}
    G90
    G1 X{park_x} Y{park_y} F10000

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Pause the current print and park the toolhead
gcode:
    {% if printer.print_stats.state == "printing" %}
        {% set current_z = printer.toolhead.position.z|float %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set park_z = [current_z + 5.0, max_z - 1.0]|min %}
        RESPOND MSG="PAUSE macro: pausing print"
        PAUSE_BASE
        SAVE_GCODE_STATE NAME=PAUSE_PARK_STATE
        G90
        {% if park_z > current_z %}
            G1 Z{park_z} F3000
        {% endif %}
        PARK
        RESTORE_GCODE_STATE NAME=PAUSE_PARK_STATE
        RESPOND PREFIX=tgalarm_photo MSG="⛔ Print paused."
    {% else %}
        RESPOND MSG="PAUSE macro: ignored, no active file print"
    {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume the paused print
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Resuming print"
        RESUME_BASE
    {% else %}
        RESPOND MSG="RESUME ignored: printer is not paused"
    {% endif %}

[pause_resume]
recover_velocity: 200

[gcode_macro CANCEL_PRINT]
description: Safely cancel the current print
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set park_z = [current_z + 10.0, max_z - 1.0]|min %}
    M104 S0
    M140 S0
    M106 S0
    G90
    {% if park_z > current_z %}
        G1 Z{park_z} F3000
    {% endif %}
    PARK
    BASE_CANCEL_PRINT
    M84
    RESPOND PREFIX=tgalarm_photo MSG="❌ Print cancelled."

[gcode_macro M600]
description: Pause the print for a manual filament change
gcode:
    {% if printer.print_stats.state == "printing" %}
        RESPOND MSG="M600: filament change requested"
        PAUSE
        RESPOND PREFIX=tgalarm_photo MSG="🧵 Filament change requested. Load the new filament, purge manually, then press RESUME."
    {% else %}
        RESPOND MSG="M600 ignored: no active file print"
    {% endif %}

[gcode_macro G29]
description: Full bed calibration
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    G90
    G1 X10 Y10 Z10 F6000
    RESPOND MSG="Full bed calibration complete"

[gcode_macro TEST_SPEED]
description: Test maximum XY speed and acceleration for skipped steps
gcode:
    # User parameters
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|float %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|float %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound = params.BOUND|default(20)|float %}
    {% set small_pattern_size = params.SMALLPATTERNSIZE|default(20)|float %}
    # Configured travel limits
    {% set travel_x_min = printer.toolhead.axis_minimum.x|float %}
    {% set travel_x_max = printer.toolhead.axis_maximum.x|float %}
    {% set travel_y_min = printer.toolhead.axis_minimum.y|float %}
    {% set travel_y_max = printer.toolhead.axis_maximum.y|float %}
    {% set travel_z_max = printer.toolhead.axis_maximum.z|float %}
    # Prevent the test pattern from using negative XY coordinates
    {% set safe_x_min = [travel_x_min, 0.0]|max %}
    {% set safe_y_min = [travel_y_min, 0.0]|max %}
    # Large test pattern limits
    {% set x_min = safe_x_min + bound %}
    {% set x_max = travel_x_max - bound %}
    {% set y_min = safe_y_min + bound %}
    {% set y_max = travel_y_max - bound %}
    # Mechanical centre of the configured XY travel
    {% set x_center = (travel_x_min + travel_x_max) / 2.0 %}
    {% set y_center = (travel_y_min + travel_y_max) / 2.0 %}
    # Small centre pattern limits
    {% set half_small_pattern = small_pattern_size / 2.0 %}
    {% set x_center_min = x_center - half_small_pattern %}
    {% set x_center_max = x_center + half_small_pattern %}
    {% set y_center_min = y_center - half_small_pattern %}
    {% set y_center_max = y_center + half_small_pattern %}
    # Safe Z height for the XY movement test
    {% set requested_test_z = bound + 10.0 %}
    {% set test_z = [requested_test_z, travel_z_max - 1.0]|min %}
    # Consistent comparison point near the XY maximum
    {% set reference_x = travel_x_max - 1.0 %}
    {% set reference_y = travel_y_max - 1.0 %}
    # Validate parameters before moving
    {% if speed <= 0 %}
        { action_raise_error("TEST_SPEED: SPEED must be greater than 0") }
    {% endif %}
    {% if accel <= 0 %}
        { action_raise_error("TEST_SPEED: ACCEL must be greater than 0") }
    {% endif %}
    {% if iterations < 1 %}
        { action_raise_error("TEST_SPEED: ITERATIONS must be at least 1") }
    {% endif %}
    {% if bound < 1 %}
        { action_raise_error("TEST_SPEED: BOUND must be at least 1 mm") }
    {% endif %}
    {% if small_pattern_size <= 0 %}
        { action_raise_error("TEST_SPEED: SMALLPATTERNSIZE must be greater than 0") }
    {% endif %}
    {% if x_min >= x_max %}
        { action_raise_error("TEST_SPEED: BOUND leaves no usable X travel") }
    {% endif %}
    {% if y_min >= y_max %}
        { action_raise_error("TEST_SPEED: BOUND leaves no usable Y travel") }
    {% endif %}
    {% if x_center_min < travel_x_min or x_center_max > travel_x_max %}
        { action_raise_error("TEST_SPEED: small pattern exceeds configured X travel") }
    {% endif %}
    {% if y_center_min < travel_y_min or y_center_max > travel_y_max %}
        { action_raise_error("TEST_SPEED: small pattern exceeds configured Y travel") }
    {% endif %}
    SAVE_GCODE_STATE NAME=TEST_SPEED_STATE
    { action_respond_info("TEST_SPEED: %d iteration(s), speed %.0f mm/s, acceleration %.0f mm/s², bound %.0f mm"% (iterations, speed, accel, bound)) }
    ####################################################################
    # Initial homing and MCU reference position
    ####################################################################
    M400
    G28
    # Move away from the sensorless endstops before homing X/Y again
    G90
    G0 X{x_max} Y{y_max} F1800
    M400
    # Establish the initial sensorless-homing reference
    G28 X Y
    G90
    G0 X{reference_x} Y{reference_y} F1800
    G4 P1000
    GET_POSITION
    ####################################################################
    # Move to the test start position
    ####################################################################
    G90
    G0 Z{test_z} F600
    G0 X{x_min} Y{y_min} F{speed * 60.0}
    M400
    ####################################################################
    # Apply temporary speed and acceleration limits
    ####################################################################
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2.0}
    {% endif %}
    ####################################################################
    # Movement patterns
    ####################################################################
    {% for i in range(iterations) %}
        # Large diagonals
        G0 X{x_min} Y{y_min} F{speed * 60.0}
        G0 X{x_max} Y{y_max} F{speed * 60.0}
        G0 X{x_min} Y{y_min} F{speed * 60.0}
        G0 X{x_max} Y{y_min} F{speed * 60.0}
        G0 X{x_min} Y{y_max} F{speed * 60.0}
        G0 X{x_max} Y{y_min} F{speed * 60.0}
        # Large box
        G0 X{x_min} Y{y_min} F{speed * 60.0}
        G0 X{x_min} Y{y_max} F{speed * 60.0}
        G0 X{x_max} Y{y_max} F{speed * 60.0}
        G0 X{x_max} Y{y_min} F{speed * 60.0}
        # Small diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed * 60.0}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60.0}
        G0 X{x_center_min} Y{y_center_min} F{speed * 60.0}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60.0}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60.0}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60.0}
        # Small box
        G0 X{x_center_min} Y{y_center_min} F{speed * 60.0}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60.0}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60.0}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60.0}
    {% endfor %}
    M400
    ####################################################################
    # Restore configured motion limits
    ####################################################################
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}
    ####################################################################
    # Final homing and MCU reference position
    ####################################################################
    # Move away from the sensorless endstops before the final homing
    G90
    G0 X{x_max} Y{y_max} F1800
    M400
    G28 X Y
    G90
    G0 X{reference_x} Y{reference_y} F1800
    G4 P1000
    GET_POSITION
    RESTORE_GCODE_STATE NAME=TEST_SPEED_STATE
    RESPOND MSG="TEST_SPEED complete. Compare the initial and final MCU stepper positions."