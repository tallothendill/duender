#######################################################################
##        HEATBED
#######################################################################

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 100

[z_tilt]
z_positions:
    -8, 125
    243, 125
points:
    15, 100
    230, 100
speed: 150
horizontal_move_z: 2

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

#######################################################################
##        FANS
#######################################################################

[fan]
pin: PA4

[heater_fan hotend]
pin: PA3
heater: extruder
heater_temp: 50.0

