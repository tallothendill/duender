#######################################################################
# Duender M5P/CB2/Dragonburner/Bambulabs P1P/Sherpa mini/Eddy
# USER CONFIGURATION:
# SEARCH FOR "### " THROUGH THE FILE TO FIND AND ADJUST MANDATORY NEEDED VALUES
# SEARCH FOR "## " THROUGH THE FILE TO FIND AND ADJUST OPTIONAL TUNING (CONSERVATIVE) VALUES
#######################################################################

[include mainsail.cfg]
[include sensorless.cfg]
[include macros.cfg]
# [include Line_Purge.cfg]

[exclude_object]
[respond]


######################################################################
#       MCU and UUID SETTINGS
# Find UUIDs (in ssh)
# 1 sudo service stop klipper
# 2 ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
# 3 sudo service start klipper
######################################################################

[mcu]
canbus_uuid : CHANGE_ME ###use the M5P uuid you wrote down during flashing procedure

[temperature_sensor MCU] 
sensor_type: temperature_mcu

[mcu CB2]
serial: /tmp/klipper_host_mcu

[temperature_sensor CB2] 
sensor_type: temperature_host

[mcu eddy]
canbus_uuid : CHANGE_ME ###use the Eddy uuid you wrote down during flashing procedure
restart_method: command

[temperature_sensor eddy_MCU]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26


########################################################################
#       PRINTER KINEMATICS
########################################################################

[printer]
kinematics: corexy
max_velocity: 200 ## Conservative 200. Normal 300. Fast 400. Extreme 500.
max_accel: 3000 ## Conservative 3000. Normal 8000. Fast 12000. Extreme 20000.
max_z_velocity: 10 ## Conservative 10. Normal 20. Fast 25.
max_z_accel: 100 ## Conservative 100. Normal 200. Fast 250.

[force_move]
enable_force_move: True


#######################################################################
#       MOTORS AND DRIVERS
#######################################################################

[stepper_x]
enable_pin: !PA15
step_pin: PC8
dir_pin: PC9 ## To invert motor add a ! before the pin e.g. PC9 <=> !PC9
microsteps: 32
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 235 ### Adjust to the right coordinates where the head touches the frame
position_min: -5 ### Adjust to the left coordinates where the nozzle leaves the bed OR the head touches the frame
position_max: 235 ### Adjust to the right coordinates where the nozzle leaves the bed OR touches the frame
homing_speed: 30 ## Conservative 30. Normal 50.
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PD9
run_current: 0.800
diag_pin: PD3
driver_SGTHRS: 150 ### Adjust sensorless homing. Higher value = more sensitive, earlier stall. Lower value = less sensitive, more force.
interpolate: True

[stepper_y]
enable_pin: !PA13
step_pin: PA10
dir_pin: !PA14 ## To invert motor add a ! before the pin e.g. PC14 <=> !PC14
microsteps: 32
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 235 ### Adjust to the back coordinates where the head touches the frame
position_min: -5 ### Adjust to the front coordinates where the nozzle leaves the bed OR the head touches the frame. May be negative if nozzle/probe must travel outside the bed area (like with Medusa HC)
position_max: 235 ### Adjust to the back coordinates where the nozzle leaves the bed OR touches the frame
homing_speed: 30 ## Conservative 30. Normal 50.
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 0.800
diag_pin: PD2
driver_SGTHRS: 150  ### Adjust sensorless homing. Higher value = more sensitive, earlier stall. Lower value = less sensitive, more force.
interpolate: True

[stepper_z]
enable_pin: !PA9
step_pin: PC6
dir_pin: !PC7 ## To invert motor add a ! before the pin e.g. PC7 <=> !PC7. CHECK BOTH Z MOTORS.
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 240 ### Adjust to the maximum Z travel of your printer
position_min: -2 
homing_speed: 5 ## Conservative 5. Normal 10. Fast 20.

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 0.7
interpolate: True

[stepper_z1]
enable_pin: !PA8
step_pin: PB12
dir_pin: !PB11 ## To invert motor add a ! before the pin e.g. PB11 <=> !PB11. CHECK BOTH Z MOTORS.
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PB2
run_current: 0.7
interpolate: True

[extruder]
enable_pin: !PC4
step_pin: PB0
dir_pin: PB1 ## To invert motor rotation add a ! before the pin e.g. PB1 <=> !PB1.
microsteps: 16
gear_ratio: 5:1
rotation_distance: 22.388 ### Adjust after extrusion calibration (100 mm extrusion test).
max_extrude_only_distance: 101
max_extrude_cross_section: 5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA1
control: pid
pid_kp: 23.441  ### Those are to be adjusted by a PID tuning,
pid_ki: 1.628   ### Send PID_CALIBRATE HEATER=extruder TARGET=210 to the console,
pid_kd: 84.389  ### Then SAVE_CONFIG.
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PA6
run_current: 0.350
interpolate: True


#######################################################################
#       HEATBED AND EDDY PROBE
#######################################################################

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_kp: 75.448  ### Those are to be adjusted by a PID tuning,
pid_ki: 1.935   ### Send PID_CALIBRATE HEATER=heater_bed TARGET=60 to the console,
pid_kd: 735.620 ### Then SAVE_CONFIG.
min_temp: 0
max_temp: 100

####################################################
### Eddy calibration
# 1. LDC_CALIBRATE_DRIVE_CURRENT CHIP=eddy
# 2. SAVE_CONFIG
# 3. PROBE_EDDY_CURRENT_CALIBRATE_AUTO CHIP=eddy
# 4. SAVE_CONFIG
####################################################
[probe_eddy_current eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0 ### Distance between Eddy coil center and nozzle.
y_offset: 25 ### Distance between Eddy coil center and nozzle.
descend_z: 0.5 # Recommended by Klipper documentation. Do NOT use for Z offset.
frequency: 12000000
max_sensor_hz: 5000000
samples: 3
samples_result: median
samples_tolerance: 0.02
samples_tolerance_retries: 3
#tap_threshold: # Only required for METHOD=tap. Automatically calculated and saved after Eddy calibration and TAP setup.
tap_z_offset: 0.0 

[bed_mesh]
speed: 80 ## Conservative 80. Normal 200. Fast 300.
horizontal_move_z: 10 ## Conservative 10. Normal 5.
mesh_min: 10,10 ### Adjust this value, make sure the eddy probe center can reach this front/left coordinates
mesh_max: 225,210 ### Adjust this value, make sure the eddy probe center can reach this back/right coordinates
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10

[z_tilt]
z_positions:
    -8, 125 ### Check position of the left leadscrew relative to the bed
    243, 125 ### Check position of the right leadscrew relative to the bed
points:
    50, 117.5 ### Over the bed surface, near the left leadscrew
    180, 117.5 ### Over the bed surface, near the right leadscrew
speed: 80 ## Conservative 80. Normal 150. Fast 200.
horizontal_move_z: 10 ## Conservative 10. Normal 5.
retries: 4
retry_tolerance: 0.02

[bed_screws]
screw1: 30.5, 37
screw1_name: Front Left
screw2: 30.5, 207
screw2_name: Front Right
screw3: 204.5, 207
screw3_name: Back Right
screw4: 204.5, 37
screw4_name: Back Left


#######################################################################
#       FANS
#######################################################################

[fan]
pin: PA4

[heater_fan hotend]
pin: PA3
heater: extruder
heater_temp: 50.0

[temperature_fan Electronics_fan]
pin: PC11
sensor_type: temperature_host
min_temp: 0
max_temp: 90
target_temp: 40.0
control: watermark

#[heater_fan SoC_fan]
#pin: CB1: gpio79
#pin: RPI: gpio26


