#######################################################################
##        HEATBED AND EDDY PROBE
#######################################################################

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp = 75.448
pid_Ki = 1.935
pid_Kd = 735.620
min_temp: 0
max_temp: 130

[probe_eddy_current eddy]
sensor_type: ldc1612
frequency: 12000000       #   The frequency (in Hz) of the sensor's internal clock. The default is 12 MHz.
#intb_pin:                #   MCU gpio pin connected to the ldc1612 sensor's INTB pin. The default is to not use the INTB pin.
#max_sensor_hz: 5000000   #   This is used during internal clock rate configuration. This value is typically only configured if the software reports a warning suggesting the value should be increased.
descend_z: 0.5            #   The nominal distance (in mm) between the nozzle and bed that a probing attempt should stop at. This parameter must be provided.
#i2c_address:             #   The i2c settings for the sensor chip. See the "common I2C settings" section for a description of the above parameters.
i2c_mcu: eddy
i2c_bus: i2c0f
#i2c_software_scl_pin: 
#i2c_software_sda_pin: 
#i2c_speed: 
x_offset: 0               #   The distance (in mm) between the probe and the nozzle along the X axis. The default is 0.
y_offset: 25              #   The distance (in mm) between the probe and the nozzle along the Y axis. The default is 0. 
#speed:                   #   The next settings apply only to regular probe commands. They do not have an effect if using a probe "METHOD" of "scan", "rapid_scan", or "tap".
#lift_speed:
#samples:
#sample_retract_dist:
#samples_result:
#samples_tolerance:
#samples_tolerance_retries:
#tap_threshold:           #   Descent stop threshold (in Hz/mm) for "tap" probing. Larger values reduce the chance of the toolhead incorrectly stopping early due to noise, while increasing the risk of the toolhead not correctly
                          #   stopping when it first contacts the bed. See Eddy_Probe.md for more information. This value may be overridden at run-time using the "TAP_THRESHOLD" parameter on probe commands.
                          #   The default is to not enable "tap" probing.
#tap_z_offset: 0.0        #   The Z height (in mm) of the nozzle relative to the bed at the contact point detected during "tap" probing. Nominally this would be 0.0 to indicate the contact point has zero distance.
                          #   But you may set this to account for backlash, thermal expansion, a systemic probing bias, or similar. The default is zero.

[bed_mesh]
horizontal_move_z: 5
speed: 150
mesh_min: 20, 20  # modify these so the probe can reach bed corners. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
mesh_max: 195, 210 # modify these so the probe can reach bed corners. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
probe_count: 5,5
algorithm: lagrange
fade_start: 1
fade_end: 10
bicubic_tension: 0.15

[safe_z_home]
home_xy_position: 110, 110 # Choose an X,Y position that is in the center of your bed. For a 300x300 machine that will be 150, 150. Use the same principle to calculate your bed center.
z_hop: 10
z_hop_speed: 25
speed: 200

[z_tilt]
z_positions:
    50, 120
    230, 120
points:
    50, 120
    230, 120
speed: 150
horizontal_move_z: 10
#retries: 0
#retry_tolerance: 0

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

#######################################################################
##        FANS
#######################################################################

[fan]
pin: PA4

[heater_fan hotend]
pin: PA3
heater: extruder
heater_temp: 50.0

[temperature_fan Electronics_fan]
pin: PC11
sensor_type: temperature_host
min_temp: 0
max_temp: 90
target_temp: 40.0
control: watermark

