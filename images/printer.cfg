# This file contains common pin mappings for the BIGTREETECH Manta M5P
# To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" "8 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PD0/PD1)".

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

######################################################################
##        UUID SETTINGS
######################################################################

[mcu]
canbus_uuid : CHANGE_ME #use the uuid you wrote down during flashing procedure

[temperature_sensor MCU] 
sensor_type: temperature_mcu

[mcu CB2]
serial: /tmp/klipper_host_mcu

[temperature_sensor CB2] 
sensor_type: temperature_host

[mcu EddyNG]
canbus_uuid : CHANGE_ME #use the uuid you wrote down during flashing procedure


########################################################################
##        PRINTER KINEMATICS
########################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

#######################################################################
##        MOTORS AND DRIVERS
#######################################################################

[stepper_x]
step_pin: PC8
dir_pin: !PC9
enable_pin: !PA15
microsteps: 32
rotation_distance: 39.8
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -10
position_min: -10
position_max: 250
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PD9
run_current: 0.800
diag_pin: PD3

[stepper_y]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
microsteps: 32
rotation_distance: 39.8
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -59
position_endstop: 230
position_max: 230
homing_speed: 80
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 0.800
diag_pin: PD2

[stepper_z]
step_pin: PB12
dir_pin: PB11
enable_pin: !PA8
microsteps: 128
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 240
position_min: -50
homing_speed: 25

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 0.800
diag_pin: PC3

[stepper_z1]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 128
rotation_distance: 8

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 0.800
diag_pin: PC3

[extruder]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 16
gear_ratio: 5:1
rotation_distance: 22.388
max_extrude_only_distance: 100.0
max_extrude_cross_section: 50.0
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA1
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PB2
run_current: 0.600
diag_pin: PC2

#######################################################################
##        HEATBED
#######################################################################

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 100


#######################################################################
##        FANS
#######################################################################

[fan]
pin: PA4

[heater_fan hotend]
pin: PA3
heater: extruder
heater_temp: 50.0

